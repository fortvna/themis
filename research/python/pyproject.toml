[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "themis"
version = "0.1.0"
description = "Themis research loop: English in, YAML frozen, pandas or backtesting.py writes a run folder."
requires-python = ">=3.11"
dependencies = [
  "pandas",
  "numpy",
  "pyyaml",
  "backtesting",
]

[project.optional-dependencies]
ccxt = ["ccxt"]

[project.scripts]
themis = "themis.runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["themis*", "strategies*"]
