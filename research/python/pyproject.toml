[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "themis"
version = "0.1.0"
description = "Themis research loop: English in, YAML frozen, then pandas or backtesting.py"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ccxt = ["ccxt"]
run = ["backtesting"]

[project.scripts]
themis = "themis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["themis*"]
